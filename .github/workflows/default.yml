name: Default

on:
  push:
    branches-ignore:
      - main

permissions: {}

jobs:
  default:
    name: Default
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - run: npm install
      - run: npm run all

      - uses: ./
        id: test-1
        with:
          version: wrong
          lenient: false
        continue-on-error: true
      - env:
          OUTCOME: ${{ steps.test-1.outcome }}
        run: '[[ "failure" == "$OUTCOME" ]]'
      - env:
          CONCLUSION: ${{ steps.test-1.conclusion }}
        run: '[[ "success" == "$CONCLUSION" ]]'

      - uses: ./
        id: test-2
        with:
          version: wrong
          lenient: 'false'
        continue-on-error: true
      - env:
          OUTCOME: ${{ steps.test-2.outcome }}
        run: '[[ "failure" == "$OUTCOME" ]]'
      - env:
          CONCLUSION: ${{ steps.test-2.conclusion }}
        run: '[[ "success" == "$CONCLUSION" ]]'

      - uses: ./
        id: test-3
        with:
          version: wrong
      - env:
          RELEASE: ${{ steps.test-3.outputs.release }}
        run: '[[ "" == "$RELEASE" ]]'
      - env:
          MAJOR: ${{ steps.test-3.outputs.major }}
        run: '[[ "" == "$MAJOR" ]]'
      - env:
          MINOR: ${{ steps.test-3.outputs.minor }}
        run: '[[ "" == "$MINOR" ]]'
      - env:
          PATCH: ${{ steps.test-3.outputs.patch }}
        run: '[[ "" == "$PATCH" ]]'
      - env:
          ANY_OTHER: ${{ steps.test-3.outputs.any_other_property }}
        run: '[[ "" == "$ANY_OTHER" ]]'

      - uses: ./
        id: test-4
        with:
          version: wrong
          lenient: true
      - env:
          RELEASE: ${{ steps.test-4.outputs.release }}
        run: '[[ "" == "$RELEASE" ]]'
      - env:
          MAJOR: ${{ steps.test-4.outputs.major }}
        run: '[[ "" == "$MAJOR" ]]'
      - env:
          MINOR: ${{ steps.test-4.outputs.minor }}
        run: '[[ "" == "$MINOR" ]]'
      - env:
          PATCH: ${{ steps.test-4.outputs.patch }}
        run: '[[ "" == "$PATCH" ]]'
      - env:
          ANY_OTHER: ${{ steps.test-4.outputs.any_other_property }}
        run: '[[ "" == "$ANY_OTHER" ]]'

      - uses: ./
        id: test-5
        with:
          version: 1.2.3-alpha.gamma+4.5.6
      - env:
          RELEASE: ${{ steps.test-5.outputs.release }}
        run: '[[ "1.2.3"       == "$RELEASE" ]]'
      - env:
          MAJOR: ${{ steps.test-5.outputs.major }}
        run: '[[ "1"           == "$MAJOR" ]]'
      - env:
          MINOR: ${{ steps.test-5.outputs.minor }}
        run: '[[ "2"           == "$MINOR" ]]'
      - env:
          PATCH: ${{ steps.test-5.outputs.patch }}
        run: '[[ "3"           == "$PATCH" ]]'
      - env:
          PRERELEASE: ${{ steps.test-5.outputs.prerelease }}
        run: '[[ "alpha.gamma" == "$PRERELEASE" ]]'
      - env:
          PRERELEASE_PARTS: ${{ steps.test-5.outputs.prerelease-parts }}
        run: '[[ "2"           == "$PRERELEASE_PARTS" ]]'
      - env:
          PRERELEASE_0: ${{ steps.test-5.outputs.prerelease-0 }}
        run: '[[ "alpha"       == "$PRERELEASE_0" ]]'
      - env:
          PRERELEASE_1: ${{ steps.test-5.outputs.prerelease-1 }}
        run: '[[ "gamma"       == "$PRERELEASE_1" ]]'
      - env:
          BUILD: ${{ steps.test-5.outputs.build }}
        run: '[[ "4.5.6"       == "$BUILD" ]]'
      - env:
          BUILD_PARTS: ${{ steps.test-5.outputs.build-parts }}
        run: '[[ "3"           == "$BUILD_PARTS" ]]'
      - env:
          BUILD_0: ${{ steps.test-5.outputs.build-0 }}
        run: '[[ "4"           == "$BUILD_0" ]]'
      - env:
          BUILD_1: ${{ steps.test-5.outputs.build-1 }}
        run: '[[ "5"           == "$BUILD_1" ]]'
      - env:
          BUILD_2: ${{ steps.test-5.outputs.build-2 }}
        run: '[[ "6"           == "$BUILD_2" ]]'

      - uses: ./
        id: test-6
        with:
          version: 1.0.0
          compare-to: 2.0.0
      - env:
          COMPARISON_RESULT: ${{ steps.test-6.outputs.comparison-result }}
        run: '[[ "<" == "$COMPARISON_RESULT" ]]'

      - uses: ./
        id: test-7
        with:
          version: 1.2.3
          satisfies: 1.x
      - env:
          SATISFIES: ${{ steps.test-7.outputs.satisfies }}
        run: '[[ "true" == "$SATISFIES" ]]'

      - uses: ./
        id: test-8
        with:
          version: 1.2.3
      - env:
          INC_MAJOR: ${{ steps.test-8.outputs.inc-major }}
        run: '[[ "2.0.0"   == "$INC_MAJOR" ]]'
      - env:
          INC_PREMAJOR: ${{ steps.test-8.outputs.inc-premajor }}
        run: '[[ "2.0.0-0" == "$INC_PREMAJOR" ]]'
      - env:
          INC_MINOR: ${{ steps.test-8.outputs.inc-minor }}
        run: '[[ "1.3.0"   == "$INC_MINOR" ]]'
      - env:
          INC_PREMINOR: ${{ steps.test-8.outputs.inc-preminor }}
        run: '[[ "1.3.0-0" == "$INC_PREMINOR" ]]'
      - env:
          INC_PATCH: ${{ steps.test-8.outputs.inc-patch }}
        run: '[[ "1.2.4"   == "$INC_PATCH" ]]'
      - env:
          INC_PREPATCH: ${{ steps.test-8.outputs.inc-prepatch }}
        run: '[[ "1.2.4-0" == "$INC_PREPATCH" ]]'
      - env:
          INC_PRERELEASE: ${{ steps.test-8.outputs.inc-prerelease }}
        run: '[[ "1.2.4-0" == "$INC_PRERELEASE" ]]'

  actions-typing:
    name: Validate actions typing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: krzema12/github-actions-typing@21db25f90324def9328034891ea446b023b8ea77 # v1

name: Test satisfies (false)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: 2.1.0
          satisfies: "^1.2.0"
      - name: Assert satisfies false
        env:
          ACTUAL: ${{ steps.action.outputs.satisfies }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "false" ]; then echo "FAIL: expected 'false'"; exit 1; fi
          echo "PASS"

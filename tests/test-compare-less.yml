name: Test compare-to (less than)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: 1.2.3
          compare-to: 2.0.0
      - name: Assert comparison and diff
        env:
          CMP: ${{ steps.action.outputs.comparison-result }}
          DIFF: ${{ steps.action.outputs.diff-result }}
        run: |
          echo "comparison-result: $CMP"
          echo "diff-result: $DIFF"
          if [ "$CMP" != "<" ]; then echo "FAIL: expected '<'"; exit 1; fi
          if [ "$DIFF" != "major" ]; then echo "FAIL: expected diff 'major'"; exit 1; fi
          echo "PASS"

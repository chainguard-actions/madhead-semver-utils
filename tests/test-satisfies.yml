name: Test version range satisfaction
on:
  workflow_dispatch:
jobs:
  test-satisfies-true:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "1.5.0"
          satisfies: ">=1.0.0 <2.0.0"
      - name: Assert satisfies is true
        env:
          ACTUAL: ${{ steps.action.outputs.satisfies }}
        run: |
          echo "satisfies: $ACTUAL"
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected 'true', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

  test-satisfies-false:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "2.0.0"
          satisfies: ">=1.0.0 <2.0.0"
      - name: Assert satisfies is false
        env:
          ACTUAL: ${{ steps.action.outputs.satisfies }}
        run: |
          echo "satisfies: $ACTUAL"
          if [ "$ACTUAL" != "false" ]; then
            echo "FAIL: expected 'false', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

  test-satisfies-caret-range:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "1.2.3"
          satisfies: "^1.0.0"
      - name: Assert satisfies caret range
        env:
          ACTUAL: ${{ steps.action.outputs.satisfies }}
        run: |
          echo "satisfies: $ACTUAL"
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected 'true', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

name: Test prerelease and build parsing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: 1.2.3-alpha.1+build.42
      - name: Assert outputs
        env:
          RELEASE: ${{ steps.action.outputs.release }}
          PRERELEASE: ${{ steps.action.outputs.prerelease }}
          PRE_PARTS: ${{ steps.action.outputs.prerelease-parts }}
          PRE_0: ${{ steps.action.outputs.prerelease-0 }}
          PRE_1: ${{ steps.action.outputs.prerelease-1 }}
          BUILD: ${{ steps.action.outputs.build }}
          BUILD_PARTS: ${{ steps.action.outputs.build-parts }}
          BUILD_0: ${{ steps.action.outputs.build-0 }}
          BUILD_1: ${{ steps.action.outputs.build-1 }}
          INC_MAJOR: ${{ steps.action.outputs.inc-major }}
          INC_PRERELEASE: ${{ steps.action.outputs.inc-prerelease }}
        run: |
          fail=0
          check() {
            echo "$1: actual='$2' expected='$3'"
            if [ "$2" != "$3" ]; then echo "FAIL: $1"; fail=1; fi
          }
          check release "$RELEASE" "1.2.3"
          check prerelease "$PRERELEASE" "alpha.1"
          check prerelease-parts "$PRE_PARTS" "2"
          check prerelease-0 "$PRE_0" "alpha"
          check prerelease-1 "$PRE_1" "1"
          check build "$BUILD" "build.42"
          check build-parts "$BUILD_PARTS" "2"
          check build-0 "$BUILD_0" "build"
          check build-1 "$BUILD_1" "42"
          check inc-major "$INC_MAJOR" "2.0.0"
          check inc-prerelease "$INC_PRERELEASE" "1.2.3-alpha.2"
          if [ "$fail" != "0" ]; then exit 1; fi
          echo "PASS"

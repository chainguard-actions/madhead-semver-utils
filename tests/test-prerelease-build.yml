name: Test prerelease and build metadata parsing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: semver
        uses: .
        with:
          version: '1.2.3-alpha.1+build.42'
      - name: Assert prerelease
        env:
          ACTUAL: ${{ steps.semver.outputs.prerelease }}
        run: |
          echo "prerelease: $ACTUAL"
          if [ "$ACTUAL" != "alpha.1" ]; then
            echo "FAIL: expected prerelease 'alpha.1', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert prerelease-parts count
        env:
          ACTUAL: ${{ steps.semver.outputs.prerelease-parts }}
        run: |
          echo "prerelease-parts: $ACTUAL"
          if [ "$ACTUAL" != "2" ]; then
            echo "FAIL: expected prerelease-parts '2', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert prerelease-0
        env:
          ACTUAL: ${{ steps.semver.outputs.prerelease-0 }}
        run: |
          echo "prerelease-0: $ACTUAL"
          if [ "$ACTUAL" != "alpha" ]; then
            echo "FAIL: expected prerelease-0 'alpha', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert prerelease-1
        env:
          ACTUAL: ${{ steps.semver.outputs.prerelease-1 }}
        run: |
          echo "prerelease-1: $ACTUAL"
          if [ "$ACTUAL" != "1" ]; then
            echo "FAIL: expected prerelease-1 '1', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert build
        env:
          ACTUAL: ${{ steps.semver.outputs.build }}
        run: |
          echo "build: $ACTUAL"
          if [ "$ACTUAL" != "build.42" ]; then
            echo "FAIL: expected build 'build.42', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert build-parts count
        env:
          ACTUAL: ${{ steps.semver.outputs.build-parts }}
        run: |
          echo "build-parts: $ACTUAL"
          if [ "$ACTUAL" != "2" ]; then
            echo "FAIL: expected build-parts '2', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

name: Test version increment outputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "1.2.3"
      - name: Assert inc-major
        env:
          ACTUAL: ${{ steps.action.outputs.inc-major }}
        run: |
          echo "inc-major: $ACTUAL"
          if [ "$ACTUAL" != "2.0.0" ]; then
            echo "FAIL: expected '2.0.0', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert inc-minor
        env:
          ACTUAL: ${{ steps.action.outputs.inc-minor }}
        run: |
          echo "inc-minor: $ACTUAL"
          if [ "$ACTUAL" != "1.3.0" ]; then
            echo "FAIL: expected '1.3.0', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert inc-patch
        env:
          ACTUAL: ${{ steps.action.outputs.inc-patch }}
        run: |
          echo "inc-patch: $ACTUAL"
          if [ "$ACTUAL" != "1.2.4" ]; then
            echo "FAIL: expected '1.2.4', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert inc-premajor
        env:
          ACTUAL: ${{ steps.action.outputs.inc-premajor }}
        run: |
          echo "inc-premajor: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty inc-premajor"
            exit 1
          fi
          echo "PASS: $ACTUAL"
      - name: Assert inc-preminor
        env:
          ACTUAL: ${{ steps.action.outputs.inc-preminor }}
        run: |
          echo "inc-preminor: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty inc-preminor"
            exit 1
          fi
          echo "PASS: $ACTUAL"
      - name: Assert inc-prepatch
        env:
          ACTUAL: ${{ steps.action.outputs.inc-prepatch }}
        run: |
          echo "inc-prepatch: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty inc-prepatch"
            exit 1
          fi
          echo "PASS: $ACTUAL"
      - name: Assert inc-prerelease
        env:
          ACTUAL: ${{ steps.action.outputs.inc-prerelease }}
        run: |
          echo "inc-prerelease: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty inc-prerelease"
            exit 1
          fi
          echo "PASS: $ACTUAL"

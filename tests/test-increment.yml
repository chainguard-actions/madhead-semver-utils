name: Test version increment outputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: semver
        uses: .
        with:
          version: '1.2.3'
      - name: Assert inc-major output
        env:
          ACTUAL: ${{ steps.semver.outputs.inc-major }}
        run: |
          echo "actual inc-major: $ACTUAL"
          if [ "$ACTUAL" != "2.0.0" ]; then
            echo "FAIL: expected '2.0.0', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert inc-minor output
        env:
          ACTUAL: ${{ steps.semver.outputs.inc-minor }}
        run: |
          echo "actual inc-minor: $ACTUAL"
          if [ "$ACTUAL" != "1.3.0" ]; then
            echo "FAIL: expected '1.3.0', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert inc-patch output
        env:
          ACTUAL: ${{ steps.semver.outputs.inc-patch }}
        run: |
          echo "actual inc-patch: $ACTUAL"
          if [ "$ACTUAL" != "1.2.4" ]; then
            echo "FAIL: expected '1.2.4', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert inc-premajor output
        env:
          ACTUAL: ${{ steps.semver.outputs.inc-premajor }}
        run: |
          echo "actual inc-premajor: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty inc-premajor"
            exit 1
          fi
          echo "PASS: inc-premajor=$ACTUAL"
      - name: Assert inc-preminor output
        env:
          ACTUAL: ${{ steps.semver.outputs.inc-preminor }}
        run: |
          echo "actual inc-preminor: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty inc-preminor"
            exit 1
          fi
          echo "PASS: inc-preminor=$ACTUAL"
      - name: Assert inc-prepatch output
        env:
          ACTUAL: ${{ steps.semver.outputs.inc-prepatch }}
        run: |
          echo "actual inc-prepatch: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty inc-prepatch"
            exit 1
          fi
          echo "PASS: inc-prepatch=$ACTUAL"

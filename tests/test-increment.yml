name: Test version increment outputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: semver
        uses: .
        with:
          version: '1.2.3'
      - name: Assert inc-major
        env:
          ACTUAL: ${{ steps.semver.outputs.inc-major }}
        run: |
          echo "inc-major: $ACTUAL"
          if [ "$ACTUAL" != "2.0.0" ]; then
            echo "FAIL: expected inc-major '2.0.0', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert inc-minor
        env:
          ACTUAL: ${{ steps.semver.outputs.inc-minor }}
        run: |
          echo "inc-minor: $ACTUAL"
          if [ "$ACTUAL" != "1.3.0" ]; then
            echo "FAIL: expected inc-minor '1.3.0', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert inc-patch
        env:
          ACTUAL: ${{ steps.semver.outputs.inc-patch }}
        run: |
          echo "inc-patch: $ACTUAL"
          if [ "$ACTUAL" != "1.2.4" ]; then
            echo "FAIL: expected inc-patch '1.2.4', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert inc-premajor
        env:
          ACTUAL: ${{ steps.semver.outputs.inc-premajor }}
        run: |
          echo "inc-premajor: $ACTUAL"
          if [ "$ACTUAL" != "2.0.0-0" ]; then
            echo "FAIL: expected inc-premajor '2.0.0-0', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert inc-preminor
        env:
          ACTUAL: ${{ steps.semver.outputs.inc-preminor }}
        run: |
          echo "inc-preminor: $ACTUAL"
          if [ "$ACTUAL" != "1.3.0-0" ]; then
            echo "FAIL: expected inc-preminor '1.3.0-0', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert inc-prepatch
        env:
          ACTUAL: ${{ steps.semver.outputs.inc-prepatch }}
        run: |
          echo "inc-prepatch: $ACTUAL"
          if [ "$ACTUAL" != "1.2.4-0" ]; then
            echo "FAIL: expected inc-prepatch '1.2.4-0', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert inc-prerelease
        env:
          ACTUAL: ${{ steps.semver.outputs.inc-prerelease }}
        run: |
          echo "inc-prerelease: $ACTUAL"
          if [ "$ACTUAL" != "1.2.4-0" ]; then
            echo "FAIL: expected inc-prerelease '1.2.4-0', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

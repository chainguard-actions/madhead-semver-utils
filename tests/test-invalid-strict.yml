name: Test invalid version (lenient false)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          version: not-a-version
          lenient: 'false'
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RELEASE: ${{ steps.action.outputs.release }}
        run: |
          echo "outcome: $OUTCOME release: '$RELEASE'"
          if [ "$OUTCOME" != "failure" ]; then echo "FAIL: expected failure"; exit 1; fi
          if [ -n "$RELEASE" ]; then echo "FAIL: expected empty release"; exit 1; fi
          echo "PASS"

name: Test pre-release version parsing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: semver
        uses: .
        with:
          version: "2.0.0-alpha.1+build.42"
      - name: Assert major
        env:
          ACTUAL: ${{ steps.semver.outputs.major }}
        run: |
          echo "actual major: $ACTUAL"
          if [ "$ACTUAL" != "2" ]; then
            echo "FAIL: expected major '2', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert minor
        env:
          ACTUAL: ${{ steps.semver.outputs.minor }}
        run: |
          echo "actual minor: $ACTUAL"
          if [ "$ACTUAL" != "0" ]; then
            echo "FAIL: expected minor '0', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert patch
        env:
          ACTUAL: ${{ steps.semver.outputs.patch }}
        run: |
          echo "actual patch: $ACTUAL"
          if [ "$ACTUAL" != "0" ]; then
            echo "FAIL: expected patch '0', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert prerelease
        env:
          ACTUAL: ${{ steps.semver.outputs.prerelease }}
        run: |
          echo "actual prerelease: $ACTUAL"
          if [ "$ACTUAL" != "alpha.1" ]; then
            echo "FAIL: expected prerelease 'alpha.1', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert prerelease-parts count
        env:
          ACTUAL: ${{ steps.semver.outputs.prerelease-parts }}
        run: |
          echo "actual prerelease-parts: $ACTUAL"
          if [ "$ACTUAL" != "2" ]; then
            echo "FAIL: expected prerelease-parts '2', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert build
        env:
          ACTUAL: ${{ steps.semver.outputs.build }}
        run: |
          echo "actual build: $ACTUAL"
          if [ "$ACTUAL" != "build.42" ]; then
            echo "FAIL: expected build 'build.42', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert build-parts count
        env:
          ACTUAL: ${{ steps.semver.outputs.build-parts }}
        run: |
          echo "actual build-parts: $ACTUAL"
          if [ "$ACTUAL" != "2" ]; then
            echo "FAIL: expected build-parts '2', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

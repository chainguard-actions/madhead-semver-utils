name: Test version with v-prefix
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: semver
        uses: .
        with:
          version: 'v2.5.1'
          lenient: 'true'
      - name: Assert major
        env:
          ACTUAL: ${{ steps.semver.outputs.major }}
        run: |
          echo "actual major: $ACTUAL"
          if [ "$ACTUAL" != "2" ]; then
            echo "FAIL: expected major '2', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert minor
        env:
          ACTUAL: ${{ steps.semver.outputs.minor }}
        run: |
          echo "actual minor: $ACTUAL"
          if [ "$ACTUAL" != "5" ]; then
            echo "FAIL: expected minor '5', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert patch
        env:
          ACTUAL: ${{ steps.semver.outputs.patch }}
        run: |
          echo "actual patch: $ACTUAL"
          if [ "$ACTUAL" != "1" ]; then
            echo "FAIL: expected patch '1', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert release
        env:
          ACTUAL: ${{ steps.semver.outputs.release }}
        run: |
          echo "actual release: $ACTUAL"
          if [ "$ACTUAL" != "2.5.1" ]; then
            echo "FAIL: expected release '2.5.1', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

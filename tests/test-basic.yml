name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: 1.2.3
      - name: Assert outputs
        env:
          RELEASE: ${{ steps.action.outputs.release }}
          MAJOR: ${{ steps.action.outputs.major }}
          MINOR: ${{ steps.action.outputs.minor }}
          PATCH: ${{ steps.action.outputs.patch }}
          INC_MAJOR: ${{ steps.action.outputs.inc-major }}
          INC_PREMAJOR: ${{ steps.action.outputs.inc-premajor }}
          INC_MINOR: ${{ steps.action.outputs.inc-minor }}
          INC_PREMINOR: ${{ steps.action.outputs.inc-preminor }}
          INC_PATCH: ${{ steps.action.outputs.inc-patch }}
          INC_PREPATCH: ${{ steps.action.outputs.inc-prepatch }}
          INC_PRERELEASE: ${{ steps.action.outputs.inc-prerelease }}
          PRERELEASE: ${{ steps.action.outputs.prerelease }}
          BUILD: ${{ steps.action.outputs.build }}
          CMP: ${{ steps.action.outputs.comparison-result }}
          DIFF: ${{ steps.action.outputs.diff-result }}
          SAT: ${{ steps.action.outputs.satisfies }}
        run: |
          fail=0
          check() {
            echo "$1: actual='$2' expected='$3'"
            if [ "$2" != "$3" ]; then echo "FAIL: $1"; fail=1; fi
          }
          check release "$RELEASE" "1.2.3"
          check major "$MAJOR" "1"
          check minor "$MINOR" "2"
          check patch "$PATCH" "3"
          check inc-major "$INC_MAJOR" "2.0.0"
          check inc-premajor "$INC_PREMAJOR" "2.0.0-0"
          check inc-minor "$INC_MINOR" "1.3.0"
          check inc-preminor "$INC_PREMINOR" "1.3.0-0"
          check inc-patch "$INC_PATCH" "1.2.4"
          check inc-prepatch "$INC_PREPATCH" "1.2.4-0"
          check inc-prerelease "$INC_PRERELEASE" "1.2.4-0"
          check prerelease "$PRERELEASE" ""
          check build "$BUILD" ""
          check comparison-result "$CMP" ""
          check diff-result "$DIFF" ""
          check satisfies "$SAT" ""
          if [ "$fail" != "0" ]; then exit 1; fi
          echo "PASS"

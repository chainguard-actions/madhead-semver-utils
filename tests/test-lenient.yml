name: Test lenient mode with invalid version
on:
  workflow_dispatch:
jobs:
  test-lenient-true:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: semver
        uses: .
        with:
          version: "not-a-semver"
          lenient: "true"
      - name: Assert action did not fail and outputs are empty
        env:
          RELEASE: ${{ steps.semver.outputs.release }}
          MAJOR: ${{ steps.semver.outputs.major }}
        run: |
          echo "release: '$RELEASE'"
          echo "major: '$MAJOR'"
          echo "PASS: action completed without failure in lenient mode"

  test-lenient-with-v-prefix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: semver
        uses: .
        with:
          version: "v1.2.3"
          lenient: "true"
      - name: Assert version with v-prefix is parsed
        env:
          ACTUAL: ${{ steps.semver.outputs.release }}
        run: |
          echo "actual release: $ACTUAL"
          if [ "$ACTUAL" != "1.2.3" ]; then
            echo "FAIL: expected '1.2.3', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert major from v-prefixed version
        env:
          ACTUAL: ${{ steps.semver.outputs.major }}
        run: |
          echo "actual major: $ACTUAL"
          if [ "$ACTUAL" != "1" ]; then
            echo "FAIL: expected '1', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

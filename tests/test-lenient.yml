name: Test lenient mode with invalid version
on:
  workflow_dispatch:
jobs:
  test-lenient-true:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: semver
        uses: .
        with:
          version: 'not-a-semver'
          lenient: 'true'
      - name: Assert action did not fail with lenient mode
        run: |
          echo "Action completed without failure in lenient mode"
          echo "PASS"

name: Test compare-to
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: less
        uses: .
        with:
          version: 1.2.3
          compare-to: 2.0.0
      - id: greater
        uses: .
        with:
          version: 1.3.0
          compare-to: 1.2.9
      - id: equal
        uses: .
        with:
          version: 1.2.3
          compare-to: 1.2.3
      - name: Assert outputs
        env:
          LESS_CMP: ${{ steps.less.outputs.comparison-result }}
          LESS_DIFF: ${{ steps.less.outputs.diff-result }}
          GT_CMP: ${{ steps.greater.outputs.comparison-result }}
          GT_DIFF: ${{ steps.greater.outputs.diff-result }}
          EQ_CMP: ${{ steps.equal.outputs.comparison-result }}
          EQ_DIFF: ${{ steps.equal.outputs.diff-result }}
        run: |
          fail=0
          check() {
            echo "$1: actual='$2' expected='$3'"
            if [ "$2" != "$3" ]; then echo "FAIL: $1"; fail=1; fi
          }
          check less-comparison "$LESS_CMP" "<"
          check less-diff "$LESS_DIFF" "major"
          check greater-comparison "$GT_CMP" ">"
          check greater-diff "$GT_DIFF" "minor"
          check equal-comparison "$EQ_CMP" "="
          check equal-diff "$EQ_DIFF" ""
          if [ "$fail" != "0" ]; then exit 1; fi
          echo "PASS"

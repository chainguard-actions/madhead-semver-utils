name: Test lenient mode with invalid version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: semver
        uses: .
        with:
          version: "not-a-semver"
          lenient: "true"
      - name: Assert action did not fail and outputs are empty or undefined
        env:
          RELEASE: ${{ steps.semver.outputs.release }}
          MAJOR: ${{ steps.semver.outputs.major }}
        run: |
          echo "release: $RELEASE"
          echo "major: $MAJOR"
          echo "PASS: action completed without failure in lenient mode"

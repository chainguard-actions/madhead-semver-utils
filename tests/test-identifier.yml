name: Test identifier input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: 1.2.3
          identifier: beta
          lenient: 'false'
      - name: Assert inc-premajor with identifier
        env:
          ACTUAL: ${{ steps.action.outputs.inc-premajor }}
        run: |
          echo "actual inc-premajor: $ACTUAL"
          if [ "$ACTUAL" != "2.0.0-beta.0" ]; then
            echo "FAIL: expected '2.0.0-beta.0' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert inc-preminor with identifier
        env:
          ACTUAL: ${{ steps.action.outputs.inc-preminor }}
        run: |
          echo "actual inc-preminor: $ACTUAL"
          if [ "$ACTUAL" != "1.3.0-beta.0" ]; then
            echo "FAIL: expected '1.3.0-beta.0' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert inc-prepatch with identifier
        env:
          ACTUAL: ${{ steps.action.outputs.inc-prepatch }}
        run: |
          echo "actual inc-prepatch: $ACTUAL"
          if [ "$ACTUAL" != "1.2.4-beta.0" ]; then
            echo "FAIL: expected '1.2.4-beta.0' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert inc-prerelease with identifier
        env:
          ACTUAL: ${{ steps.action.outputs.inc-prerelease }}
        run: |
          echo "actual inc-prerelease: $ACTUAL"
          if [ "$ACTUAL" != "1.2.4-beta.0" ]; then
            echo "FAIL: expected '1.2.4-beta.0' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

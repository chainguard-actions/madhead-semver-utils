name: Test identifier input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: 1.2.3
          identifier: beta
      - name: Assert inc-premajor contains identifier
        env:
          ACTUAL: ${{ steps.action.outputs.inc-premajor }}
        run: |
          echo "actual inc-premajor: $ACTUAL"
          if echo "$ACTUAL" | grep -q "beta"; then
            echo "PASS: inc-premajor contains identifier 'beta'"
          else
            echo "FAIL: expected inc-premajor to contain 'beta', got: $ACTUAL"
            exit 1
          fi
      - name: Assert inc-preminor contains identifier
        env:
          ACTUAL: ${{ steps.action.outputs.inc-preminor }}
        run: |
          echo "actual inc-preminor: $ACTUAL"
          if echo "$ACTUAL" | grep -q "beta"; then
            echo "PASS: inc-preminor contains identifier 'beta'"
          else
            echo "FAIL: expected inc-preminor to contain 'beta', got: $ACTUAL"
            exit 1
          fi
      - name: Assert inc-prepatch contains identifier
        env:
          ACTUAL: ${{ steps.action.outputs.inc-prepatch }}
        run: |
          echo "actual inc-prepatch: $ACTUAL"
          if echo "$ACTUAL" | grep -q "beta"; then
            echo "PASS: inc-prepatch contains identifier 'beta'"
          else
            echo "FAIL: expected inc-prepatch to contain 'beta', got: $ACTUAL"
            exit 1
          fi
      - name: Assert inc-prerelease contains identifier
        env:
          ACTUAL: ${{ steps.action.outputs.inc-prerelease }}
        run: |
          echo "actual inc-prerelease: $ACTUAL"
          if echo "$ACTUAL" | grep -q "beta"; then
            echo "PASS: inc-prerelease contains identifier 'beta'"
          else
            echo "FAIL: expected inc-prerelease to contain 'beta', got: $ACTUAL"
            exit 1
          fi
